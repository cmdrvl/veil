name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli

      - name: Spine static rules (ast-grep)
        run: ast-grep scan

      - name: Smoke doctor surface
        run: |
          cargo run --locked -- --describe
          cargo run --locked -- --schema
          cargo run --locked -- capabilities --json
          cargo run --locked -- robot-docs guide
          cargo run --locked -- doctor
          cargo run --locked -- doctor --json
          cargo run --locked -- doctor capabilities --json
          cargo run --locked -- doctor triage --json
          cargo run --locked -- doctor robot-docs
          # Deprecated aliases stay working for at least one release.
          cargo run --locked -- --robot-triage
          cargo run --locked -- doctor health

  # The real sandbox-exec checks are macOS-only, including the file-link denial.
  macos-seatbelt-sandbox:
    name: macos-seatbelt-sandbox
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prove Seatbelt read and hardlink restrictions
        run: cargo test --locked --test sandbox
