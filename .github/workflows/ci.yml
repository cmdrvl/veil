name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Run fixed-seed label and enforcement properties
        env:
          PROPTEST_CASES: 512
          PROPTEST_RNG_SEED: "314159265"
        run: cargo test --features proptest

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli

      - name: Spine static rules (ast-grep)
        run: ast-grep scan

      - name: Smoke doctor surface
        run: |
          cargo run --locked -- --describe
          cargo run --locked -- --schema
          cargo run --locked -- capabilities --json
          cargo run --locked -- robot-docs guide
          cargo run --locked -- doctor
          cargo run --locked -- doctor --json
          cargo run --locked -- doctor capabilities --json
          cargo run --locked -- doctor triage --json
          cargo run --locked -- doctor robot-docs
          # Deprecated aliases stay working for at least one release.
          cargo run --locked -- --robot-triage
          cargo run --locked -- doctor health

  # The real sandbox-exec checks are macOS-only, including the file-link denial.
  macos-seatbelt-sandbox:
    name: macos-seatbelt-sandbox
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prove Seatbelt read and hardlink restrictions
        run: cargo test --locked --test sandbox

      - name: Prove the derived registry under Seatbelt
        run: cargo test --locked --test derived

  linux-landlock-sandbox:
    name: linux-landlock-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Prove compiled Landlock read restrictions on the kernel
        run: cargo test --locked --test sandbox landlock_applies_compiled_read_rules -- --nocapture

  # bd-sel. The hook is installed (`cargo install`, then `veil install` inside the
  # script), and every row of docs/bypass-matrix.json is sent to the command
  # `veil install` wrote, as a PreToolUse payload, on both platforms. The matrix
  # drift check itself runs in the `rust` job's `cargo test`
  # (tests/bypass_matrix.rs): this job is the installed binary on macOS and Linux.
  e2e-hook-matrix:
    name: e2e-hook-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install veil
        run: cargo install --path . --locked --root "$RUNNER_TEMP/veil-install"

      - name: Run every matrix row through the installed hook
        # `shell: bash` is what turns on pipefail: without it `| tee` would hide
        # the script's exit status and a mismatch would pass the job.
        shell: bash
        run: |
          tests/e2e_hook_matrix.sh \
            --veil "$RUNNER_TEMP/veil-install/bin/veil" \
            --run-dir "$RUNNER_TEMP/e2e-hook-matrix" \
            | tee "$RUNNER_TEMP/e2e-hook-matrix.log"

      - name: Show the summary table
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/e2e-hook-matrix/summary.txt"
          if [ -f "$summary" ]; then
            {
              echo '### Installed-hook matrix (${{ matrix.os }})'
              echo '```'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no summary.txt: the run did not get as far as the table" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hook-matrix-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/e2e-hook-matrix
            ${{ runner.temp }}/e2e-hook-matrix.log
          if-no-files-found: warn
