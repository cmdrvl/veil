[package]
name = "veil"
version = "0.4.2"
edition = "2024"
authors = ["CMD+RVL <engineering@cmdrvl.com>"]
description = "Data exfiltration guard for AI coding agents"
license = "MIT"
repository = "https://github.com/cmdrvl/veil"
readme = "README.md"
keywords = ["ai", "security", "hooks", "privacy", "cli"]
categories = ["command-line-utilities"]

[features]
proptest = ["dep:proptest"]

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
boundary-detectors = { git = "https://github.com/cmdrvl/boundary-detectors", rev = "679d490964a58f2b0f0c2fbc8a51d05503143e04" }
clap = { version = "4.5.39", features = ["derive"] }
proptest = { version = "=1.12.0", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
toml = "0.8.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep the veil binary size-optimized while the scanner and its matchers are
# built for speed. The root benchmark checks the shared crate's scan budgets.
[profile.release.package.boundary-detectors]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.base64]
opt-level = 3

[[bench]]
name = "boundary_detectors_latency"
harness = false

[dev-dependencies]
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "=0.4.8"
