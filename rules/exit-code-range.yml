id: exit-code-range
language: rust
message: |
  R-002: Spine tools use exit codes 0, 1, 2 and, only for a documented policy
  verdict, 3 (see docs/exit-codes.md and exit-code-policy-band.yml).
  process::exit() with any other hardcoded value violates the exit-code
  dictionary. Use the ExitCode enum or return from run().
severity: error
note: "Golden Rule R-002 (Exit code trinity)"
rule:
  any:
    - pattern: process::exit(4)
    - pattern: process::exit(5)
    - pattern: process::exit(127)
    - pattern: process::exit(-1)
    - pattern: process::exit(255)
